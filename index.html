<meta name="claude:viewport-fit-sides" content="cover">
<title>Battery Monitoring System</title>
<style>
  /* Layout: sticky header (title + clock + view switch); below it either the
     battery list ("Live") or the service list ("Service"). */
  :root{
    /* Dark palette (default — for a wall-mounted screen) */
    --bg:#0c1016; --surface:#151b24; --surface-2:#1b2330; --line:#28333f;
    --fg:#eef2f7; --muted:#8a97a8;
    --accent:#38bdf8;
    --ok:#3fb950; --warn:#e3a008; --crit:#f85149;
    --ok-dim:#13351f; --warn-dim:#3a2d07; --crit-dim:#3d1512;
    --font-ui:"Inter",-apple-system,system-ui,sans-serif;
    --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d9dfe7;
      --fg:#101722; --muted:#5a6676;
      --accent:#0284c7;
      --ok:#1a7f37; --warn:#bf8700; --crit:#d1242f;
      --ok-dim:#dcf3e2; --warn-dim:#f6edcf; --crit-dim:#fbe3e2;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d9dfe7;
    --fg:#101722; --muted:#5a6676;
    --accent:#0284c7;
    --ok:#1a7f37; --warn:#bf8700; --crit:#d1242f;
    --ok-dim:#dcf3e2; --warn-dim:#f6edcf; --crit-dim:#fbe3e2;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--font-ui); line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}

  .wrap{
    max-width:1100px; margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }

  /* Header */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:15;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .head-in{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    text-align:left;gap:16px;padding-block:10px}
  .brand{display:flex;align-items:center;justify-content:flex-start;gap:11px;min-width:0}
  .logo{width:36px;height:36px;flex:none;border-radius:9px;background:
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 85%,#000),var(--accent));
    display:grid;place-items:center;color:#06121b}
  .logo svg{width:21px;height:21px}
  .brand-text{min-width:0}
  .brand h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.15}
  .brand .sub{font-size:.74rem;color:var(--muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-meta{display:flex;align-items:center;gap:10px;flex:none}
  .dt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
  .date{font-family:var(--font-data);font-size:.72rem;color:var(--muted);white-space:nowrap}
  .clock{font-family:var(--font-data);font-size:.84rem;color:var(--fg);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  @media (max-width:560px){
    .brand h1{font-size:1.08rem}
    .brand .sub{display:none}
    .logo{width:32px;height:32px}
  }
  .demo-chip{font-size:.66rem;letter-spacing:.4px;text-transform:uppercase;
    color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
    background:var(--warn-dim);padding:3px 8px;border-radius:999px;white-space:nowrap}

  /* Tabs */
  .tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;width:100%;margin-block:10px 0}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--font-ui);
    font-size:.86rem;font-weight:600;padding:9px 10px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .tab svg{width:16px;height:16px}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--fg);
    box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 40%,transparent) inset,0 1px 3px rgba(0,0,0,.25)}
  .tab .badge{font-family:var(--font-data);font-size:.66rem;background:var(--crit);color:#fff;
    border-radius:999px;padding:0 6px;line-height:1.5;min-width:18px;text-align:center}

  main{padding-block:16px 32px}

  /* ============ Live view (list — one stacker per row) ============ */
  .grid{display:flex;flex-direction:column;gap:12px}
  .list-head{display:grid;grid-template-columns:minmax(150px,1.3fr) 78px 104px minmax(150px,2fr) auto;gap:10px 18px;align-items:center;
    padding:0 18px 2px;font-size:.66rem;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .list-head span:nth-child(2){text-align:right}
  .list-head span:last-child{justify-self:end}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    position:relative;overflow:hidden;padding:30px 18px;
    display:grid;grid-template-columns:minmax(150px,1.3fr) 78px 104px minmax(150px,2fr) auto;
    grid-template-areas:"name pct volt graph pill";gap:10px 18px;align-items:center}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--st-color,var(--line))}
  .c-name{grid-area:name;min-width:0;display:flex;align-items:center;gap:12px}
  .st-img{height:82px;width:auto;max-width:92px;flex:none;object-fit:contain;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .st-text{min-width:0}
  .c-pct{grid-area:pct;text-align:right}
  .c-volt{grid-area:volt}
  .c-graph{grid-area:graph;min-width:0;display:flex;flex-direction:column;gap:6px}
  .c-pill{grid-area:pill;justify-self:end;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .st-name{font-size:1rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st-meta{font-size:.72rem;color:var(--muted);margin:2px 0 0;font-family:var(--font-data)}
  .pill{font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;
    min-width:108px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--st-color);background:var(--st-dim);border:1px solid color-mix(in srgb,var(--st-color) 40%,transparent)}
  .pct{font-family:var(--font-data);font-weight:700;font-size:2rem;line-height:1;
    color:var(--st-color);font-variant-numeric:tabular-nums}
  .pct small{font-size:.9rem}
  .volt{font-family:var(--font-data);font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
  .volt small{color:var(--muted);font-size:.72rem}
  .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--st-color);transition:width .6s ease}
  .spark{width:100%;height:84px;display:block}
  .trend{display:flex;gap:6px;align-items:flex-start}
  .trend-y{display:flex;flex-direction:column;justify-content:space-between;height:84px;flex:none;
    font-size:.54rem;color:var(--muted);font-family:var(--font-data);text-align:right}
  .trend-main{flex:1;min-width:0}
  .c-live{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;color:var(--muted);margin-top:4px}
  .c-live b{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.c-live b{animation:none}}
  /* ---- Service mode ---- */
  .card.in-service{grid-template-areas:"name pct volt graph pill" "svc svc svc svc svc"}
  .card.in-service::before{background:var(--warn)}
  .svc-toggle{margin-top:9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
    font-family:var(--font-ui);font-weight:600;font-size:.68rem;padding:3px 10px 3px 4px;border-radius:999px}
  .svc-toggle .svc-track{width:26px;height:15px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
  .svc-toggle .svc-knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .svc-toggle.on{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-dim)}
  .svc-toggle.on .svc-track{background:var(--warn)}
  .svc-toggle.on .svc-knob{left:13px}
  .c-svc{grid-area:svc;display:flex;align-items:center;gap:9px;margin-top:4px;
    background:var(--warn-dim);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
    border-radius:10px;padding:9px 12px;font-size:.82rem;color:var(--fg)}
  .c-svc .svc-ic{width:17px;height:17px;flex:none;color:var(--warn)}
  .c-svc .svc-txt{flex:1;min-width:0}
  .c-svc .svc-txt b{color:var(--warn)}
  .c-svc .svc-since{color:var(--muted);font-size:.72rem;font-family:var(--font-data);white-space:nowrap}
  /* Service prompt modal */
  .svc-modal{max-width:440px}
  .svc-modal h3{margin:0 0 6px;font-size:1.1rem}
  .svc-sub{color:var(--muted);font-size:.84rem;margin:0 0 14px}
  .svc-modal textarea{width:100%;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--surface-2);color:var(--fg);font-family:var(--font-ui);font-size:.92rem}
  .svc-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  /* Service view: incidents */
  .inc-active{display:flex;gap:10px;align-items:flex-start;background:var(--warn-dim);
    border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:.86rem}
  .inc-active .svc-ic{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
  .inc-active b{color:var(--warn)}
  .inc-sub{color:var(--muted);font-size:.74rem;font-family:var(--font-data);margin-top:3px}
  .inc-head{font-size:.68rem;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .inc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .inc-list li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2)}
  .inc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
  .inc-range{font-weight:700;font-size:.82rem}
  .inc-dur{font-size:.7rem;color:var(--muted);font-family:var(--font-data)}
  .inc-row{display:flex;gap:10px;font-size:.8rem;padding:1px 0}
  .inc-row>span{color:var(--muted);min-width:54px;flex:none}
  .inc-row>b{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .inc-active{overflow-wrap:anywhere;word-break:break-word}
  .plan-what,.svc-txt{word-break:break-word}
  .inc-right{display:flex;align-items:center;gap:6px}
  .inc-f{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:.78rem;color:var(--muted)}
  .inc-f>span{min-width:54px;flex:none}
  .inc-f input{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--fg);font-family:var(--font-ui);font-size:.82rem}
  .inc-edit .acts{display:flex;gap:8px;margin-top:10px}
  .srv-head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .svc-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-ui);
    font-weight:600;font-size:.75rem;padding:6px 13px;border-radius:999px;white-space:nowrap;
    border:1px solid var(--line);background:var(--surface-2);color:var(--muted);transition:color .15s,border-color .15s}
  .svc-btn:hover{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 25%,var(--line))}
  .svc-btn .svc-ic{width:14px;height:14px;flex:none}
  .svc-btn.on{color:var(--warn);background:var(--warn-dim);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .svc-btn.on:hover{border-color:var(--warn)}
  /* Planned services */
  .due-badge{display:inline-flex}
  .due.none{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
  .plan-head,.log-head{font-size:.68rem;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:12px 0 7px}
  .plan-empty{font-size:.82rem;color:var(--muted);margin:10px 0 2px}
  .plan-list{list-style:none;margin:0 0 2px;padding:0;display:flex;flex-direction:column;gap:7px}
  .plan{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2)}
  .plan-when{font-weight:700;font-size:.74rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .plan.ok .plan-when{color:var(--ok);background:var(--ok-dim)}
  .plan.soon .plan-when{color:var(--warn);background:var(--warn-dim)}
  .plan.over .plan-when{color:var(--crit);background:var(--crit-dim)}
  .plan-what{flex:1 1 130px;min-width:0;font-weight:600;font-size:.86rem;overflow-wrap:anywhere;word-break:break-word}
  .plan-rep{font-size:.68rem;color:var(--muted);font-family:var(--font-data);white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .plan-date{font-size:.72rem;color:var(--muted);font-family:var(--font-data);white-space:nowrap}
  .plan .rec-actions{display:flex;align-items:center;gap:5px}
  .srv-forms{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .dur-row{display:flex;gap:8px;align-items:center}
  .dur-row input[type=number]{width:74px}
  /* Pretty "Add planned service" form */
  .plan-form{display:flex;flex-direction:column;gap:14px;margin-top:14px;max-width:430px}
  .pf-field{display:flex;flex-direction:column;gap:6px}
  .pf-label{font-size:.7rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .plan-form input[type=text],.plan-form input[type=number],.plan-form select{
    font-family:var(--font-ui);font-size:.92rem;background:var(--surface-2);color:var(--fg);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .plan-form input:focus,.plan-form select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .pf-interval{display:flex;gap:8px}
  .pf-interval input[type=number]{width:86px;text-align:center}
  .pf-interval select{flex:1;max-width:150px;cursor:pointer}
  .pf-repeat{display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 13px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface-2);transition:border-color .15s}
  .pf-repeat:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .pf-repeat input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .pf-switch{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .pf-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .pf-repeat input:checked ~ .pf-switch{background:var(--accent)}
  .pf-repeat input:checked ~ .pf-switch .pf-knob{left:18px}
  .pf-repeat-txt{display:flex;flex-direction:column;font-size:.88rem;font-weight:600;color:var(--fg);line-height:1.2}
  .pf-repeat-txt small{font-weight:400;font-size:.72rem;color:var(--muted);margin-top:2px}
  .plan-form .btn{align-self:flex-start;padding:10px 20px}
  @media (max-width:620px){
    .list-head{display:none}
    .card{grid-template-columns:1fr auto;
      grid-template-areas:"name pill" "pct volt" "graph graph";gap:10px 14px}
    .c-pct{text-align:left}
    .c-volt{justify-self:end}
    .pct{font-size:2.4rem}
    .st-img{height:88px;max-width:96px}
  }

  /* ============ Service view ============ */
  .alert{display:flex;gap:10px;align-items:flex-start;background:var(--crit-dim);
    border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;font-size:.86rem}
  .alert svg{width:18px;height:18px;flex:none;color:var(--crit);margin-top:1px}
  .alert.hidden{display:none}

  .srv{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;position:relative}
  .srv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .srv-head h3{margin:0;font-size:1rem}
  .due{font-family:var(--font-data);font-size:.76rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .due.ok{color:var(--ok);background:var(--ok-dim)}
  .due.soon{color:var(--warn);background:var(--warn-dim)}
  .due.over{color:var(--crit);background:var(--crit-dim)}
  .srv-last{font-size:.82rem;color:var(--muted);margin:10px 0 0}
  .srv-last b{color:var(--fg);font-weight:600}
  .srv-src{font-size:.72rem;color:var(--muted);opacity:.85;margin:4px 0 0}
  .due-btn{border:0;background:transparent;padding:0;cursor:pointer;font:inherit}
  .due-btn:hover{opacity:.82}
  .srv-pop{position:absolute;right:16px;top:54px;z-index:6;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);
    padding:12px 14px;min-width:230px;max-width:min(300px,calc(100% - 32px));
    display:flex;flex-direction:column;gap:6px}
  .pop-row{display:flex;justify-content:space-between;gap:16px;font-size:.78rem;color:var(--muted)}
  .pop-row b{color:var(--fg);font-weight:600;text-align:right}
  .pop-note{font-size:.72rem;color:var(--muted);margin:4px 0 0;line-height:1.5}
  .pop-row-col{flex-direction:column;gap:2px}
  .pop-row-col b{text-align:left}

  .log{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
  .log li{display:flex;gap:10px;font-size:.82rem;padding:8px 10px;background:var(--surface-2);
    border-radius:8px;border:1px solid var(--line)}
  .log .d{font-family:var(--font-data);color:var(--muted);flex:none;font-size:.76rem;padding-top:1px}
  .log .empty{color:var(--muted);font-style:italic;background:transparent;border:0;padding:4px 0}
  .log .note{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .rec-actions{display:flex;gap:2px;flex:none;margin-left:auto}
  .icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;
    padding:3px 6px;border-radius:5px;line-height:1}
  .icon-btn:hover{background:var(--line);color:var(--fg)}
  .log .edit-li{display:block;padding:10px}
  .edit-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
  .edit-form input{font-family:var(--font-ui);font-size:.82rem;background:var(--surface);
    color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  .edit-form input[type=date]{width:auto}
  .edit-form .note-in{flex:1 1 140px;min-width:0}
  .edit-form .chk{display:inline-flex;flex-direction:row;align-items:center;gap:6px;width:auto;
    font-size:.78rem;color:var(--muted);cursor:pointer}
  .edit-form .chk input{width:auto;margin:0}
  .edit-form .acts{display:flex;gap:6px;flex:none}
  .form-hint{font-size:.72rem;color:var(--muted);margin:2px 0 0}
  .btn.sm{padding:6px 12px;font-size:.78rem}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:var(--crit);color:#fff}
  .log .confirm-li{align-items:center}
  .confirm-li .note{color:var(--crit);font-weight:600}

  details{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--accent);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ ";font-family:var(--font-data)}
  details[open] summary::before{content:"– "}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:12px}

const CHEM_LABEL = { lead:"Lead-acid", lifepo4:"Lithium (LiFePO4)" };

/* ---------- Chemistry -> percent ----------
   Lead-acid: resting voltage, normalised to a 12V block.
   Lithium: normalised per cell (for the future — unused in the demo). */
const LEAD = [[12.73,100],[12.62,90],[12.50,80],[12.37,70],[12.24,60],[12.10,50],[11.96,40],[11.81,30],[11.66,20],[11.51,10],[11.40,0]];
const LIFE = [[3.45,100],[3.40,99],[3.35,90],[3.32,80],[3.30,70],[3.28,60],[3.26,50],[3.25,40],[3.22,30],[3.20,20],[3.13,10],[3.00,5],[2.80,0]];
function lerp(table,x){
  if(x>=table[0][0])return 100;
  if(x<=table[table.length-1][0])return 0;
  for(let i=0;i<table.length-1;i++){
    const[vh,ph]=table[i],[vl,pl]=table[i+1];
    if(x<=vh&&x>=vl)return Math.round(pl+(x-vl)/(vh-vl)*(ph-pl));
  }
  return 0;
}
function pctFromV(b, v){
  if(b.chem==="lead")  return lerp(LEAD, v/(b.nominal/12));
  if(b.chem==="lifepo4")return lerp(LIFE, v/Math.round(b.nominal/3.2));
  return 0;
}
function percentOf(b){ return pctFromV(b, b.v); }
function statusOf(pct){
  if(pct>=50)return {key:"ok",   label:"Good",        color:"var(--ok)",  dim:"var(--ok-dim)"};
  if(pct>=20)return {key:"warn", label:"Charge soon", color:"var(--warn)",dim:"var(--warn-dim)"};
  return            {key:"crit", label:"Charge now",  color:"var(--crit)",dim:"var(--crit-dim)"};
}

/* ---------- Charging detection (voltage-only) ----------
   A charger pushes voltage well above anything a battery reaches at rest,
   so "voltage above the charge threshold" marks an on-charger period.
   lead-acid full rest ≈ 1.06×nominal, float ≈ 1.13×nominal → 1.10× separates them. */
const CHARGE_ST={key:"charge",label:"⚡ Charging",color:"var(--accent)",dim:"color-mix(in srgb,var(--accent) 16%,transparent)"};
function chargeThreshold(b){ return b.chem==="lifepo4" ? b.nominal*1.12 : b.nominal*1.10; }
function chargingNow(b){
  const p=sparkPoints(b.id); if(!p.length) return false;
  return p[p.length-1].v >= chargeThreshold(b);
}
// While charging, voltage-based SoC is invalid, so the bar falls back to the last
// resting SoC seen before the charge started (the most recent sub-threshold point).
function restPctWhenCharging(b){
  const p=sparkPoints(b.id), thr=chargeThreshold(b);
  for(let i=p.length-1;i>=0;i--){ if(p[i].v<thr) return pctFromV(b, p[i].v); }
  return null;
}
// How long a stacker has been charging: id -> ms when the current charge run began (live), or null.
const chargeSince={};
async function fetchChargeStart(b){
  try{
    const thr=chargeThreshold(b);
    const r=await fetch(`${SUPABASE_URL}/rest/v1/readings?stacker_id=eq.${b.id}&voltage=lt.${thr}&select=created_at&order=created_at.desc&limit=1`,{
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }
    });
    const rows=await r.json();
    if(Array.isArray(rows)&&rows.length) return new Date(rows[0].created_at).getTime();
  }catch(e){ console.warn("charge-start fetch failed:",e); }
  const p=sparkPoints(b.id); return p.length? p[0].t : Date.now();   // fallback: oldest point in window
}

/* ---------- Live sparkline: last 6 minutes, one point per minute ----------
   The node sends one reading per minute, so the window holds ~7 points and
   the segments between them are straight (no sub-minute data). */
const SPARK_MS=6*60000;   // window
const SPARK_PTS=7;        // -6m .. now (demo)
const SPARK={};
STACKERS.forEach(b=>{
  if(LIVE_MODE){ SPARK[b.id]=[{t:Date.now(), v:b.v}]; }
  else { const a=[]; for(let k=0;k<SPARK_PTS;k++) a.push(b.v+(Math.random()*0.25-0.125)); a[SPARK_PTS-1]=b.v; SPARK[b.id]=a; }
});
// Returns the sparkline points as {t,v}. Demo builds synthetic minute marks.
function sparkPoints(id){
  if(LIVE_MODE) return SPARK[id]||[];
  const a=SPARK[id]||[], now=Date.now(), n=a.length;
  return a.map((v,i)=>({t:now-(n-1-i)*60000, v}));
}

/* ---------- 72h history (generated for the demo) ---------- */
function genHist72(b){
  const full=b.nominal*1.06, low=b.nominal*1.00, chg=chargeThreshold(b)*1.03, arr=[];
  for(let h=0;h<72;h++){
    const p=h%24;
    let v;
    if(p<16)       v = full-(full-low)*(p/16);   // daytime use: full → low
    else if(p<22)  v = chg;                      // nightly charge: elevated (charging band)
    else           v = full;                     // after charge: back to full at rest
    v += (Math.random()*0.2-0.1);
    arr.push(v);
  }
  arr[arr.length-1]=b.v;
  return arr;
}
const HIST72={};
STACKERS.forEach(b=>{ HIST72[b.id]=genHist72(b); });

function fmtDateTime(iso){ return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
function spanText(a,b){
  let ms=new Date(b)-new Date(a); if(ms<0)ms=0;
  const mins=Math.round(ms/60000), h=Math.floor(mins/60), d=Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h`;
  if(h>0) return `${h}h ${mins%60}m`;
  return `${mins}m`;
}

const DAY=86400000;
function addMonths(iso,m){ const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+m); return d; }
function addMonthsStr(iso,m){ const d=addMonths(iso,m);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

const PLAN_KEY="stacker_plans_v1";   // {id:[{due,what,created}]}
function offsetDate(days){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function makeDefaultPlans(){ const t=offsetDate(0);
  return {1:[{due:offsetDate(10),what:"Top up cell water",created:t,repeat:{amount:2,unit:"weeks"}},
             {due:offsetDate(42),what:"Quarterly inspection & watering",created:t,repeat:null}],
          2:[{due:offsetDate(-9),what:"Full inspection & charge test",created:t,repeat:null}],
          3:[{due:offsetDate(64),what:"Quarterly inspection",created:t,repeat:null}]}; }

function plDays(d){ return d===1?"day":"days"; }
function daysUntil(due){ return Math.round((new Date(due+"T00:00:00")-new Date(new Date().toDateString()))/DAY); }
function dueFromNow(amount,unit){
  const d=new Date(); d.setHours(0,0,0,0);
  if(unit==="days")       d.setDate(d.getDate()+amount);
  else if(unit==="weeks") d.setDate(d.getDate()+amount*7);
  else                    d.setMonth(d.getMonth()+amount);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function planInfo(id){
  const list=PLANS[id]||[]; if(!list.length) return null;
  const sorted=list.map((p,i)=>({...p,_i:i})).sort((a,b)=>a.due<b.due?-1:1);
  const p=sorted[0];
  return {plan:p, days:daysUntil(p.due), due:new Date(p.due+"T00:00:00"), all:sorted};
}

/* ---------- Sparkline ---------- */
function sparkline(points,color){
  const w=240,h=40,pad=3,divs=6;
  const now=Date.now(), tStart=now-SPARK_MS;
  const vs=points.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(!isFinite(mn)){mn=0;mx=1;}
  const rng=(mx-mn)||1;
  const X=t=>pad+((t-tStart)/SPARK_MS)*(w-2*pad);
  const Y=v=>h-pad-((v-mn)/rng)*(h-2*pad);
  let gmin="";
  for(let k=0;k<=divs;k++){ const gx=(pad+(k/divs)*(w-2*pad)).toFixed(1);
    gmin+=`<line class="gmin" x1="${gx}" y1="${pad}" x2="${gx}" y2="${h-pad}" vector-effect="non-scaling-stroke"/>`; }
  const P=points.filter(p=>p.t>=tStart).map(p=>[X(p.t),Y(p.v)]);
  let body="";
  if(P.length>=2){
    const d=P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=d+` L ${P[P.length-1][0].toFixed(1)} ${h-pad} L ${P[0][0].toFixed(1)} ${h-pad} Z`;
    body=`<path d="${area}" fill="${color}" opacity="0.12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  }
  const last=P.length? `<circle cx="${P[P.length-1][0].toFixed(1)}" cy="${P[P.length-1][1].toFixed(1)}" r="3" fill="${color}"/>`:"";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${gmin}${body}${last}</svg>`;
}

/* Update only the changing values — never touches the <img>, so no reload or flicker. */
function updateCards(){
  STACKERS.forEach(b=>{
    const c=cardEls[b.id]; if(!c)return;
    const pct=percentOf(b), charging=chargingNow(b), st=charging?CHARGE_ST:statusOf(pct);
    const rest = charging ? restPctWhenCharging(b) : pct;
    const elapsed = charging && chargeSince[b.id]!=null ? (Date.now()-chargeSince[b.id]) : null;
    c.card.classList.toggle("is-charging",charging);
    c.card.style.setProperty("--st-color",st.color);
    c.card.style.setProperty("--st-dim",st.dim);
    c.pct.innerHTML = charging ? `<span class="dur">${elapsed!=null?fmtDur(elapsed):"charging"}</span>` : `${pct}<small>%</small>`;
    c.volt.innerHTML=`${b.v.toFixed(2)} <small>V</small>`;
    c.bar.style.width=(charging?(rest!=null?rest:0):pct)+"%";
    c.pill.textContent=st.label;
    const pts=sparkPoints(b.id), vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs);
    if(c.ymax)c.ymax.textContent=mx.toFixed(1);
    if(c.ymid)c.ymid.textContent=((mn+mx)/2).toFixed(1);
    if(c.ymin)c.ymin.textContent=mn.toFixed(1);
    const spark=c.graph.querySelector(".spark");
    if(spark) spark.outerHTML=sparkline(pts,st.color);
  });
}

let editing=null;    // {id,i} of the record being edited inline, or null

function dueBadge(info){
  if(!info)return `<span class="due none">No service planned</span>`;
  if(info.days<0){const d=Math.abs(info.days);return `<span class="due over">Overdue by ${d} ${plDays(d)}</span>`;}
  if(info.days===0)return `<span class="due soon">Due today</span>`;
  if(info.days<=14)return `<span class="due soon">${info.days} ${plDays(info.days)} left</span>`;
  return `<span class="due ok">${info.days} ${plDays(info.days)} left</span>`;
}

      : `<li><div class="inc-top"><span class="inc-range">${fmtDate(x.start.slice(0,10))} → ${fmtDate(x.end.slice(0,10))}</span><span class="inc-right"><span class="inc-dur">${spanText(x.start,x.end)}</span><button class="icon-btn" data-act="incedit" data-id="${b.id}" data-i="${x._i}" title="Edit">✎</button><button class="icon-btn" data-act="incdel" data-id="${b.id}" data-i="${x._i}" title="Delete">✕</button></span></div><div class="inc-row"><span>Reason</span><b>${escapeHtml(x.reason)}</b></div><div class="inc-row"><span>Fixed</span><b>${escapeHtml(x.resolution)}</b></div></li>`
      ).join("")}</ul>`:""}`;
    return `<div class="srv">

  }).join("");

  host.querySelectorAll("form.plan-form").forEach(f=> f.addEventListener("submit",onAddPlan));

async function onAddService(e){
  e.preventDefault();
  const id=e.target.dataset.id, fd=new FormData(e.target);
  const rec={date:fd.get("date"), note:(fd.get("note")||"").trim()};
  if(!rec.note)return;
  if(LIVE_MODE){
    const rows=await sbReq("POST","service_log",{stacker_id:Number(id), service_date:rec.date, note:rec.note});
    if(rows&&rows[0]) rec.sid=rows[0].id;
  }
  (SERVICE[id]=SERVICE[id]||[]).push(rec);
  saveSrv(SERVICE);
  renderService();
}
async function onEditService(e){
  e.preventDefault();
  const id=e.target.dataset.id, i=+e.target.dataset.i, fd=new FormData(e.target);
  const note=(fd.get("note")||"").trim(); if(!note)return;
  const date=fd.get("date");
  const rec=SERVICE[id] && SERVICE[id][i]; if(!rec)return;
  rec.date=date; rec.note=note;
  if(LIVE_MODE && rec.sid) await sbReq("PATCH",`service_log?id=eq.${rec.sid}`,{service_date:date, note});
  saveSrv(SERVICE);
  editing=null; renderService();
}
async function onAddPlan(e){
  e.preventDefault();
  const id=e.target.dataset.id, fd=new FormData(e.target);
  const amount=Math.max(1, parseInt(fd.get("amount"),10)||1), unit=fd.get("unit");
  const what=(fd.get("what")||"").trim(); if(!what)return;
  const repeat=fd.get("repeat")!=null ? {amount,unit} : null;
  const plan={due:dueFromNow(amount,unit), what, created:offsetDate(0), repeat};
  if(LIVE_MODE){
    const rows=await sbReq("POST","service_plans",{stacker_id:Number(id), due:plan.due, what, created:plan.created,
      repeat_amount:repeat?repeat.amount:null, repeat_unit:repeat?repeat.unit:null});
    if(rows&&rows[0]) plan.sid=rows[0].id;
  }
  (PLANS[id]=PLANS[id]||[]).push(plan);
  savePlans(); renderService();
}
async function planDel(id,i){
  const p=PLANS[id] && PLANS[id][i]; if(!p)return;
  if(LIVE_MODE && p.sid) await sbReq("DELETE",`service_plans?id=eq.${p.sid}`);
  PLANS[id].splice(i,1); savePlans(); renderService();
}
function planDone(id,i){
  const p=(PLANS[id]||[])[i]; if(!p)return;
  const b=STACKERS.find(s=>s.id===+id);
  openSvcPrompt("Complete service — "+(b?b.name:""),
    `“${p.what}” — what did you do? (saved to the log for the record)`,
    "e.g. Topped up water in all cells, checked levels",
    async (text)=>{
      const rec={date:offsetDate(0), note:text};
      if(LIVE_MODE){
        const rows=await sbReq("POST","service_log",{stacker_id:Number(id), service_date:rec.date, note:text});
        if(rows&&rows[0]) rec.sid=rows[0].id;
      }
      (SERVICE[id]=SERVICE[id]||[]).push(rec);
      if(p.repeat){                                   // recurring → reschedule from today
        p.due=dueFromNow(p.repeat.amount, p.repeat.unit);
        if(LIVE_MODE && p.sid) await sbReq("PATCH",`service_plans?id=eq.${p.sid}`,{due:p.due});
      } else {                                        // one-off → remove
        const idx=(PLANS[id]||[]).indexOf(p);
        if(idx>-1){ if(LIVE_MODE && p.sid) await sbReq("DELETE",`service_plans?id=eq.${p.sid}`); PLANS[id].splice(idx,1); }
      }
      savePlans(); saveSrv(SERVICE); renderService();
    });
}
async function delRec(id,i){
  const rec=SERVICE[id] && SERVICE[id][i]; if(!rec)return;
  if(LIVE_MODE && rec.sid) await sbReq("DELETE",`service_log?id=eq.${rec.sid}`);
  SERVICE[id].splice(i,1);
  saveSrv(SERVICE);
  if(editing&&editing.id==id)editing=null;
  renderService();
}
function onRecClick(e){
  const sv=e.target.closest("[data-svc]"); if(sv){ toggleService(sv.dataset.svc); return; }
  const inf=e.target.closest("button[data-info]");
  if(inf){ const iid=inf.dataset.info; openInfo=(openInfo===iid?null:iid); renderService(); return; }
  const btn=e.target.closest("button[data-act]"); if(!btn)return;
  const act=btn.dataset.act, id=btn.dataset.id, i=+btn.dataset.i;
  if(act==="del"){ pendingDel={id,i}; editing=null; renderService(); }
  else if(act==="confirmdel"){ pendingDel=null; delRec(id,i); }
  else if(act==="canceldel"){ pendingDel=null; renderService(); }
  else if(act==="edit"){ editing={id,i}; pendingDel=null; renderService(); }
  else if(act==="cancel"){ editing=null; renderService(); }
  else if(act==="plandel"){ pendingPlanDel={id,i}; renderService(); }
  else if(act==="planconfirmdel"){ pendingPlanDel=null; planDel(id,i); }
  else if(act==="plancanceldel"){ pendingPlanDel=null; renderService(); }
  else if(act==="plandone"){ planDone(id,i); }
  else if(act==="incedit"){ editInc={id,i}; pendingIncDel=null; renderService(); }
  else if(act==="inccancel"){ editInc=null; renderService(); }
  else if(act==="incdel"){ pendingIncDel={id,i}; editInc=null; renderService(); }
  else if(act==="incconfirmdel"){ pendingIncDel=null; const x=INCIDENTS[id]&&INCIDENTS[id][i]; if(x){ if(LIVE_MODE&&x.sid) sbReq("DELETE",`service_incidents?id=eq.${x.sid}`); INCIDENTS[id].splice(i,1); saveSvc(); } renderService(); }
  else if(act==="inccanceldel"){ pendingIncDel=null; renderService(); }
}
async function onIncEdit(e){
  e.preventDefault();
  const id=e.target.dataset.id, i=+e.target.dataset.i, fd=new FormData(e.target);
  const reason=(fd.get("reason")||"").trim(), resolution=(fd.get("resolution")||"").trim();
  if(!reason||!resolution) return;
  const x=INCIDENTS[id]&&INCIDENTS[id][i];
  if(x){ x.reason=reason; x.resolution=resolution;
    if(LIVE_MODE && x.sid) await sbReq("PATCH",`service_incidents?id=eq.${x.sid}`,{reason, resolution});
    saveSvc(); }
  editInc=null; renderService();
}

  ta.value=""; ta.placeholder=placeholder;
  svcCb=cb;
  document.getElementById("svcModal").hidden=false;
  setTimeout(()=>ta.focus(),30);
}
function closeSvcPrompt(){ document.getElementById("svcModal").hidden=true; svcCb=null; }
function toggleService(id){
  const b=STACKERS.find(s=>s.id===+id); if(!b)return;
  if(SVCMODE[id]){
    openSvcPrompt("Resolve service — "+b.name,
      "What was fixed? This ends service mode and saves it to history.",
      "e.g. Replaced the broken mount bolt, torqued to spec", async (text)=>{
        const m=SVCMODE[id];
        const inc={start:m.startedAt, end:new Date().toISOString(), reason:m.reason, resolution:text};
        if(LIVE_MODE){
          const rows=await sbReq("POST","service_incidents",{stacker_id:Number(id), started_at:inc.start, ended_at:inc.end, reason:inc.reason, resolution:text});
          if(rows&&rows[0]) inc.sid=rows[0].id;
          await sbReq("DELETE",`service_active?stacker_id=eq.${Number(id)}`);
        }
        (INCIDENTS[id]=INCIDENTS[id]||[]).push(inc);
        delete SVCMODE[id]; saveSvc();
        renderService();
      });
  } else {
    openSvcPrompt("Start service mode — "+b.name,
      "Why is this stacker going into service?",
      "e.g. Mount bolt broke", async (text)=>{
        const started=new Date().toISOString();
        SVCMODE[id]={reason:text, startedAt:started}; saveSvc();
        if(LIVE_MODE) await sbReq("POST","service_active",{stacker_id:Number(id), reason:text, started_at:started});
        renderService();
      });
  }
}

/* ---------- Clock ---------- */
function tickClock(){
  const now=new Date();
  const c=document.getElementById("clock");
  if(c) c.textContent=now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const d=document.getElementById("dateNow");
  if(d) d.textContent=now.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  // tick the charging-duration readout once a second
  STACKERS.forEach(b=>{
    const c=cardEls[b.id]; if(!c||!c.pct)return;
    if(c.card.classList.contains("is-charging") && chargeSince[b.id]!=null){
      const el=c.pct.querySelector(".dur"); if(el) el.textContent=fmtDur(now.getTime()-chargeSince[b.id]);
    }
  });
}

/* ---------- Demo simulation ---------- */
function simulate(){
  STACKERS.forEach(b=>{
    b.v += (Math.random()*0.06-0.03);
    const pct=percentOf(b);
    if(pct<8)  b.v += 0.05;
    if(pct>98) b.v -= 0.05;
    const a=SPARK[b.id]; a.push(b.v); if(a.length>SPARK_PTS)a.shift();   // one point per (simulated) minute
  });
  updateCards();
}

/* ============================================================
   Live mode (Netlify + Supabase) — not run in the demo.
   Polls the latest readings over the REST API.
   ============================================================ */
async function pollSupabase(){
  try{
    const since=new Date(Date.now()-SPARK_MS).toISOString();
    const r=await fetch(`${SUPABASE_URL}/rest/v1/readings?created_at=gte.${encodeURIComponent(since)}&select=stacker_id,voltage,created_at&order=created_at.asc`,{
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }
    });
    const rows=await r.json();
    if(!Array.isArray(rows))return;
    const byId={};
    rows.forEach(row=>{ (byId[row.stacker_id]=byId[row.stacker_id]||[]).push({t:new Date(row.created_at).getTime(), v:Number(row.voltage)}); });
    STACKERS.forEach(b=>{ const pts=byId[b.id]; if(pts&&pts.length){ SPARK[b.id]=pts; b.v=pts[pts.length-1].v; } });
    for(const b of STACKERS){
      if(chargingNow(b)){ if(chargeSince[b.id]==null) chargeSince[b.id]=await fetchChargeStart(b); }
      else chargeSince[b.id]=null;
    }
    updateCards();
  }catch(e){ console.warn("Supabase poll failed:",e); }
}
/* ---------- Service data sync (plans / incidents / active / log) ---------- */
function SBH(){ return { apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }; }
async function sbReq(method, path, body){
  try{
    const opts={ method, headers:SBH() };
    if(body){
      opts.headers={ ...opts.headers, "Content-Type":"application/json",
        Prefer: method==="POST" ? "return=representation" : "return=minimal" };
      opts.body=JSON.stringify(body);
    }
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
    if(method==="POST"){ return await r.json().catch(()=>null); }
    return r.ok;
  }catch(e){ console.warn("Supabase",method,path,"failed:",e); return method==="POST"?null:false; }
}
async function loadServiceData(){
  try{
    const g=p=>fetch(`${SUPABASE_URL}/rest/v1/${p}`,{headers:SBH()}).then(r=>r.json()).catch(()=>[]);
    const [plans, inc, active, log] = await Promise.all([
      g("service_plans?select=*"),
      g("service_incidents?select=*"),
      g("service_active?select=*"),
      g("service_log?select=*"),
    ]);
    const P={}, I={}, M={}, S={};
    (Array.isArray(plans)?plans:[]).forEach(r=>{ (P[r.stacker_id]=P[r.stacker_id]||[]).push(
      {sid:r.id, due:r.due, what:r.what, created:r.created, repeat:r.repeat_amount?{amount:r.repeat_amount, unit:r.repeat_unit}:null}); });
    (Array.isArray(inc)?inc:[]).forEach(r=>{ (I[r.stacker_id]=I[r.stacker_id]||[]).push(
      {sid:r.id, start:r.started_at, end:r.ended_at, reason:r.reason, resolution:r.resolution}); });
    (Array.isArray(active)?active:[]).forEach(r=>{ M[r.stacker_id]={reason:r.reason, startedAt:r.started_at}; });
    (Array.isArray(log)?log:[]).forEach(r=>{ (S[r.stacker_id]=S[r.stacker_id]||[]).push(
      {sid:r.id, date:r.service_date, note:r.note}); });
    PLANS=P; INCIDENTS=I; SVCMODE=M; SERVICE=S;
    renderService();
  }catch(e){ console.warn("loadServiceData failed:",e); }
}

/* ---------- Detail chart (modal) ---------- */
function fmtDur(ms){
  const m=Math.round(ms/60000), h=Math.floor(m/60), mm=m%60;
  if(h>0 && mm>0) return `${h}h ${mm}m`;
  if(h>0) return `${h}h`;
  return `${mm}m`;
}
function drawChart(points, tStart, tEnd, color, mode, caption, chargeV){
  const W=900,H=272,ml=46,mr=16,mt=16,mb=44,pw=W-ml-mr,ph=H-mt-mb;
  const span=(tEnd-tStart)||1;
  const vs=points.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(!isFinite(mn)){mn=0;mx=1;}
  if(mn===mx){mn-=0.5;mx+=0.5;}
  const pad=(mx-mn)*0.15||0.5; mn-=pad; mx+=pad;
  const X=t=>ml+((t-tStart)/span)*pw, Y=v=>mt+ph-((v-mn)/(mx-mn))*ph;
  const hours=Math.max(1,Math.round(span/3600000));
  let minor="";
  for(let h=0;h<=hours;h++){ const x=X(tStart+h*3600000); minor+=`<line class="grid-minor" x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${(mt+ph).toFixed(1)}"/>`; }
  let grid="",ylab="";
  for(let k=0;k<=4;k++){
    const val=mn+(mx-mn)*k/4, y=Y(val);
    grid+=`<line class="grid" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    ylab+=`<text x="${ml-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${val.toFixed(1)}</text>`;
  }
  const lstep = mode==="clock" ? 3 : Math.max(1,Math.ceil(hours/24));
  let xlab="";
  for(let h=0; h<=hours; h+=lstep){
    const t=tStart+h*3600000, x=X(t);
    let lbl;
    if(mode==="clock"){ const d=new Date(t); lbl=String(d.getHours()).padStart(2,"0")+":00"; }
    else { const ago=hours-h; lbl = ago===0?"now":"-"+ago+"h"; }
    xlab+=`<text class="xl" x="${x.toFixed(1)}" y="${(H-26).toFixed(1)}" text-anchor="middle">${lbl}</text>`;
  }
  xlab+=`<text class="xcap" x="${(ml+pw/2).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle">${caption||""}</text>`;
  // charging bands: shade spans where voltage sits in the charge zone
  let shade="", legend="";
  if(chargeV){
    for(let i=0;i<points.length;){
      if(points[i].v>=chargeV){
        let j=i; while(j+1<points.length && points[j+1].v>=chargeV) j++;
        const x1=X(points[i].t), x2=X(points[j].t);
        const rx=Math.max(ml,x1-2), rw=Math.max(3,(x2-x1)+4);
        const durMs=points[j].t-points[i].t;
        const durLbl=durMs>=60000?` ${fmtDur(durMs)}`:"";
        shade+=`<rect class="chg-band" x="${rx.toFixed(1)}" y="${mt}" width="${rw.toFixed(1)}" height="${ph.toFixed(1)}"/>`;
        shade+=`<text class="chg-bolt" x="${(x1+5).toFixed(1)}" y="${(mt+15).toFixed(1)}">⚡${durLbl}</text>`;
        i=j+1;
      } else i++;
    }
    if(shade) legend=`<text class="chg-leg" x="${(W-mr).toFixed(1)}" y="${(mt+12).toFixed(1)}" text-anchor="end">⚡ charging</text>`;
  }
  const P=points.map(p=>[X(p.t),Y(p.v)]);
  let body="";
  if(P.length>=2){
    const d=P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=d+` L ${P[P.length-1][0].toFixed(1)} ${(mt+ph).toFixed(1)} L ${P[0][0].toFixed(1)} ${(mt+ph).toFixed(1)} Z`;
    body=`<path d="${area}" fill="${color}" opacity="0.1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const last=P.length?`<circle cx="${P[P.length-1][0].toFixed(1)}" cy="${P[P.length-1][1].toFixed(1)}" r="3.5" fill="${color}"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Voltage over time">
    ${minor}${grid}${shade}${body}${last}${ylab}${xlab}${legend}
  </svg>`;
}
let modalState={id:null,range:24,day:null};
let modalReq=0;
let calMonth=new Date(); calMonth.setDate(1);
let daysSet=new Set();
async function renderModal(){
  const b=STACKERS.find(s=>s.id===modalState.id); if(!b)return;
  const st=statusOf(percentOf(b));
  const reqId=++modalReq;
  document.getElementById("mTitle").textContent=`${b.name} · ${b.model}`;
  const chartEl=document.getElementById("mChart"), statsEl=document.getElementById("mStats");
  const banner=document.getElementById("dayBanner");
  let pts, tStart, tEnd, mode, caption;
  if(modalState.day){
    const [Y,M,D]=modalState.day.split("-").map(Number);
    const ds=new Date(Y, M-1, D, 0,0,0,0);          // local midnight of the chosen day
    tStart=ds.getTime(); tEnd=tStart+24*3600000; mode="clock";
    caption=ds.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
    banner.hidden=false; banner.querySelector("b").textContent=caption;
    if(LIVE_MODE){
      chartEl.innerHTML=`<p class="m-loading">Loading…</p>`; statsEl.innerHTML="";
      pts=await fetchRange(b.id, tStart, tEnd);
      if(reqId!==modalReq) return;
    }else pts=demoDay(b, tStart);
  }else{
    tEnd=Date.now(); tStart=tEnd-modalState.range*3600000; mode="ago"; caption="hours ago";
    banner.hidden=true;
    if(LIVE_MODE){
      chartEl.innerHTML=`<p class="m-loading">Loading…</p>`; statsEl.innerHTML="";
      pts=await fetchRange(b.id, tStart, tEnd);
      if(reqId!==modalReq) return;            // a newer request superseded this one
    }else{
      pts=demoHistory(b, modalState.range);
    }
  }
  document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("active", !modalState.day && +x.dataset.range===modalState.range));
  if(!pts||!pts.length){
    chartEl.innerHTML=`<p class="m-loading">No readings for this ${modalState.day?"day":"range"}.</p>`; statsEl.innerHTML="";
    return;
  }
  chartEl.innerHTML=drawChart(pts, tStart, tEnd, st.color, mode, caption, chargeThreshold(b));
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), nv=pts[pts.length-1].v;
  statsEl.innerHTML=
    `<span>${modalState.day?"Last":"Now"} <b>${nv.toFixed(2)} V</b></span><span>Min <b>${mn.toFixed(2)} V</b></span><span>Max <b>${mx.toFixed(2)} V</b></span><span>Swing <b>${(mx-mn).toFixed(2)} V</b></span>`;
}
async function fetchRange(id, sinceMs, untilMs){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/readings?stacker_id=eq.${id}&created_at=gte.${encodeURIComponent(new Date(sinceMs).toISOString())}&created_at=lt.${encodeURIComponent(new Date(untilMs).toISOString())}&select=voltage,created_at&order=created_at.asc&limit=5000`,{
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }
    });
    const rows=await r.json();
    return Array.isArray(rows)? rows.map(x=>({t:new Date(x.created_at).getTime(), v:Number(x.voltage)})) : [];
  }catch(e){ console.warn("range fetch failed:",e); return []; }
}
async function fetchDays(id){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/reading_days?stacker_id=eq.${id}&select=day&order=day.asc&limit=400`,{
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }
    });
    const rows=await r.json();
    return new Set(Array.isArray(rows)? rows.map(x=>x.day) : []);
  }catch(e){ console.warn("days fetch failed:",e); return new Set(); }
}
// Rolling N-hour demo history at 15-min resolution, nightly charge 22:00–05:00.
function demoHistory(b, hours){
  const full=b.nominal*1.06, low=b.nominal*1.00, chg=chargeThreshold(b)*1.03;
  const now=Date.now(), step=15*60000, n=Math.round(hours*4), pts=[];
  for(let i=n;i>=0;i--){
    const t=now-i*step, hr=new Date(t).getHours();
    let v;
    if(hr>=22 || hr<5)  v=chg;                       // nightly charge
    else if(hr<8)       v=full;                       // morning rest
    else                v=full-(full-low)*((hr-8)/14); // daytime use 08:00–22:00
    pts.push({t, v:v+(Math.random()*0.18-0.09)});
  }
  pts[pts.length-1].v=b.v;
  return pts;
}
// Single-day demo (00:00–24:00) at 15-min resolution, charge ~02:05–04:45.
function demoDay(b, dayStartMs){
  const full=b.nominal*1.06, low=b.nominal*1.00, chg=chargeThreshold(b)*1.03, pts=[];
  const step=15*60000;
  for(let i=0;i<=96;i++){
    const t=dayStartMs+i*step, d=new Date(t), hr=d.getHours()+d.getMinutes()/60;
    let v;
    if(hr>=2.08 && hr<=4.75) v=chg;                  // early-morning charge
    else if(hr<2)            v=low+0.1;              // pre-dawn low
    else if(hr<8)            v=full;                 // rest after charge
    else                     v=full-(full-low)*((hr-8)/16); // daytime use
    pts.push({t, v:v+(Math.random()*0.16-0.08)});
  }
  return pts;
}
function fakeDemoDays(){
  const s=new Set(), t=new Date(); t.setHours(0,0,0,0);
  for(let i=0;i<62;i++){ const d=new Date(t); d.setDate(d.getDate()-i);
    s.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`); }
  return s;
}
function renderCalendar(){
  const pop=document.getElementById("calPop");
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1);
  const title=first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const today=new Date(); today.setHours(0,0,0,0);
  const minDate=new Date(today); minDate.setMonth(minDate.getMonth()-3);
  const startDow=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const canPrev = first > new Date(minDate.getFullYear(),minDate.getMonth(),1);
  const canNext = first < new Date(today.getFullYear(),today.getMonth(),1);
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<span class="cal-cell empty"></span>`;
  for(let d=1; d<=dim; d++){
    const date=new Date(y,m,d);
    const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const inRange = date>=minDate && date<=today;
    const hasData = daysSet.has(iso);
    const sel = modalState.day===iso;
    cells+=`<button class="cal-cell${inRange?"":" disabled"}${sel?" sel":""}" ${inRange?`data-day="${iso}"`:"disabled"}>${d}${(hasData&&inRange)?'<i class="dot"></i>':""}</button>`;
  }
  pop.innerHTML=`<div class="cal-head">
      <button class="cal-nav" data-cal="prev"${canPrev?"":" disabled"} aria-label="Previous month">‹</button>
      <span class="cal-title">${title}</span>
      <button class="cal-nav" data-cal="next"${canNext?"":" disabled"} aria-label="Next month">›</button>
    </div>
    <div class="cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid">${cells}</div>
    <p class="cal-hint">Blue dot = data available</p>`;
}
async function openModal(id){
  modalState={id:+id, range:24, day:null};
  calMonth=new Date(); calMonth.setDate(1);
  document.getElementById("calPop").hidden=true;
  daysSet = LIVE_MODE ? await fetchDays(+id) : fakeDemoDays();
  renderModal();
  document.getElementById("modal").hidden=false;
}
function closeModal(){ document.getElementById("modal").hidden=true; const cp=document.getElementById("calPop"); if(cp)cp.hidden=true; }

/* ---------- Boot ---------- */
function boot(){
  if(!LIVE_MODE){
    document.getElementById("demoChip").textContent="Demo mode — simulated data";
  }else{
    document.getElementById("demoChip").hidden=true;
  }
  const h=(location.hash||"").replace("#","");
  renderCards(); renderService();
  document.getElementById("srvList").addEventListener("click",onRecClick);
  document.addEventListener("click",e=>{
    if(openInfo!=null && !e.target.closest(".srv-pop") && !e.target.closest("button[data-info]")){ openInfo=null; renderService(); }
  });
  document.getElementById("cards").addEventListener("click",e=>{
    const sv=e.target.closest("[data-svc]"); if(sv){ toggleService(sv.dataset.svc); return; }
    const g=e.target.closest("[data-details]"); if(g) openModal(g.dataset.details);
  });
  document.getElementById("svcOk").addEventListener("click",()=>{
    const ta=document.getElementById("svcInput"), v=ta.value.trim();
    if(!v){ ta.focus(); return; }
    const cb=svcCb; closeSvcPrompt(); if(cb) cb(v);
  });
  document.getElementById("svcCancel").addEventListener("click",closeSvcPrompt);
  document.getElementById("svcBackdrop").addEventListener("click",closeSvcPrompt);
  document.getElementById("mClose").addEventListener("click",closeModal);
  document.getElementById("mBackdrop").addEventListener("click",closeModal);
  document.getElementById("rangeTabs").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-range]"); if(!btn)return;
    modalState.range=+btn.dataset.range; modalState.day=null;
    renderModal();
  });
  document.getElementById("calBtn").addEventListener("click",e=>{ e.stopPropagation();
    const pop=document.getElementById("calPop");
    if(pop.hidden){ renderCalendar(); pop.hidden=false; } else pop.hidden=true;
  });
  document.getElementById("calPop").addEventListener("click",e=>{
    const nav=e.target.closest("[data-cal]");
    if(nav){ calMonth.setMonth(calMonth.getMonth()+(nav.dataset.cal==="next"?1:-1)); renderCalendar(); return; }
    const day=e.target.closest("[data-day]");
    if(day){ modalState.day=day.dataset.day; document.getElementById("calPop").hidden=true; renderModal(); }
  });
  document.getElementById("dayBanner").addEventListener("click",e=>{
    if(e.target.closest('[data-act="recent"]')){ modalState.day=null; renderModal(); }
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeSvcPrompt(); } });
  setView(h==="service"?"service":"live");
  tickClock(); setInterval(tickClock,1000);

  if(LIVE_MODE){
    pollSupabase(); setInterval(pollSupabase,15000);
    loadServiceData();
    setInterval(()=>{
      // don't clobber a form the user is filling in
      const busy = editing||editInc||pendingDel||pendingPlanDel||pendingIncDel ||
                   !document.getElementById("svcModal").hidden;
      if(!busy) loadServiceData();
    },30000);
  }
  else{ setInterval(simulate,6000); }

  document.getElementById("footNote").innerHTML =
    LIVE_MODE
    ? "Live mode — data from Supabase."
    : "Demo mode: numbers are simulated. To switch to live data, set <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> at the top of the file and deploy to Netlify.";
}
boot();
