<meta name="claude:viewport-fit-sides" content="cover">
<title>Battery Monitoring System</title>
<style>
  /* Layout: sticky header (title + clock + view switch); below it either the
     battery list ("Live") or the service list ("Service"). */
  :root{
    /* Dark palette (default — for a wall-mounted screen) */
    --bg:#0c1016; --surface:#151b24; --surface-2:#1b2330; --line:#28333f;
    --fg:#eef2f7; --muted:#8a97a8;
    --accent:#38bdf8;
    --ok:#3fb950; --warn:#e3a008; --crit:#f85149;
    --ok-dim:#13351f; --warn-dim:#3a2d07; --crit-dim:#3d1512;
    --font-ui:"Inter",-apple-system,system-ui,sans-serif;
    --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d9dfe7;
      --fg:#101722; --muted:#5a6676;
      --accent:#0284c7;
      --ok:#1a7f37; --warn:#bf8700; --crit:#d1242f;
      --ok-dim:#dcf3e2; --warn-dim:#f6edcf; --crit-dim:#fbe3e2;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d9dfe7;
    --fg:#101722; --muted:#5a6676;
    --accent:#0284c7;
    --ok:#1a7f37; --warn:#bf8700; --crit:#d1242f;
    --ok-dim:#dcf3e2; --warn-dim:#f6edcf; --crit-dim:#fbe3e2;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--font-ui); line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}

  .wrap{
    max-width:1100px; margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }

  /* Header */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:15;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .head-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:18px}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
  .logo{width:44px;height:44px;flex:none;border-radius:10px;background:
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 85%,#000),var(--accent));
    display:grid;place-items:center;color:#06121b}
  .logo svg{width:26px;height:26px}
  .brand-text{min-width:0}
  .brand h1{font-size:1.6rem;margin:0;font-weight:700;letter-spacing:.2px;text-wrap:balance}
  .brand .sub{font-size:.8rem;color:var(--muted);margin:2px 0 0}
  .head-meta{display:flex;align-items:center;justify-content:center;gap:12px}
  .clock{font-family:var(--font-data);font-size:.82rem;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .demo-chip{font-size:.66rem;letter-spacing:.4px;text-transform:uppercase;
    color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
    background:var(--warn-dim);padding:3px 8px;border-radius:999px;white-space:nowrap}

  /* Tabs */
  .tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;width:100%;margin-block:10px 0}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--font-ui);
    font-size:.86rem;font-weight:600;padding:9px 10px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .tab svg{width:16px;height:16px}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--fg);
    box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 40%,transparent) inset,0 1px 3px rgba(0,0,0,.25)}
  .tab .badge{font-family:var(--font-data);font-size:.66rem;background:var(--crit);color:#fff;
    border-radius:999px;padding:0 6px;line-height:1.5;min-width:18px;text-align:center}

  main{padding-block:16px 32px}

  /* ============ Live view (list — one stacker per row) ============ */
  .grid{display:flex;flex-direction:column;gap:12px}
  .list-head{display:grid;grid-template-columns:minmax(150px,1.3fr) 78px 104px minmax(150px,2fr) auto;gap:10px 18px;align-items:center;
    padding:0 18px 2px;font-size:.66rem;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .list-head span:nth-child(2){text-align:right}
  .list-head span:last-child{justify-self:end}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    position:relative;overflow:hidden;padding:30px 18px;
    display:grid;grid-template-columns:minmax(150px,1.3fr) 78px 104px minmax(150px,2fr) auto;
    grid-template-areas:"name pct volt graph pill";gap:10px 18px;align-items:center}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--st-color,var(--line))}
  .c-name{grid-area:name;min-width:0;display:flex;align-items:center;gap:12px}
  .st-img{height:82px;width:auto;max-width:92px;flex:none;object-fit:contain;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .st-text{min-width:0}
  .c-pct{grid-area:pct;text-align:right}
  .c-volt{grid-area:volt}
  .c-graph{grid-area:graph;min-width:0;display:flex;flex-direction:column;gap:6px}
  .c-pill{grid-area:pill;justify-self:end;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .st-name{font-size:1rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st-meta{font-size:.72rem;color:var(--muted);margin:2px 0 0;font-family:var(--font-data)}
  .pill{font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;
    min-width:108px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--st-color);background:var(--st-dim);border:1px solid color-mix(in srgb,var(--st-color) 40%,transparent)}
  .pct{font-family:var(--font-data);font-weight:700;font-size:2rem;line-height:1;
    color:var(--st-color);font-variant-numeric:tabular-nums}
  .pct small{font-size:.9rem}
  .volt{font-family:var(--font-data);font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
  .volt small{color:var(--muted);font-size:.72rem}
  .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--st-color);transition:width .6s ease}
  .spark{width:100%;height:84px;display:block}
  .trend{display:flex;gap:6px;align-items:flex-start}
  .trend-y{display:flex;flex-direction:column;justify-content:space-between;height:84px;flex:none;
    font-size:.54rem;color:var(--muted);font-family:var(--font-data);text-align:right}
  .trend-main{flex:1;min-width:0}
  .c-live{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;color:var(--muted);margin-top:4px}
  .c-live b{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.c-live b{animation:none}}
  @media (max-width:620px){
    .list-head{display:none}
    .card{grid-template-columns:1fr auto;
      grid-template-areas:"name pill" "pct volt" "graph graph";gap:10px 14px}
    .c-pct{text-align:left}
    .c-volt{justify-self:end}
    .pct{font-size:2.4rem}
    .st-img{height:88px;max-width:96px}
  }

  /* ============ Service view ============ */
  .alert{display:flex;gap:10px;align-items:flex-start;background:var(--crit-dim);
    border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;font-size:.86rem}
  .alert svg{width:18px;height:18px;flex:none;color:var(--crit);margin-top:1px}
  .alert.hidden{display:none}

  .srv{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;position:relative}
  .srv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .srv-head h3{margin:0;font-size:1rem}
  .due{font-family:var(--font-data);font-size:.76rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .due.ok{color:var(--ok);background:var(--ok-dim)}
  .due.soon{color:var(--warn);background:var(--warn-dim)}
  .due.over{color:var(--crit);background:var(--crit-dim)}
  .srv-last{font-size:.82rem;color:var(--muted);margin:10px 0 0}
  .srv-last b{color:var(--fg);font-weight:600}
  .srv-src{font-size:.72rem;color:var(--muted);opacity:.85;margin:4px 0 0}
  .due-btn{border:0;background:transparent;padding:0;cursor:pointer;font:inherit}
  .due-btn:hover{opacity:.82}
  .srv-pop{position:absolute;right:16px;top:54px;z-index:6;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);
    padding:12px 14px;min-width:230px;max-width:min(300px,calc(100% - 32px));
    display:flex;flex-direction:column;gap:6px}
  .pop-row{display:flex;justify-content:space-between;gap:16px;font-size:.78rem;color:var(--muted)}
  .pop-row b{color:var(--fg);font-weight:600;text-align:right}
  .pop-note{font-size:.72rem;color:var(--muted);margin:4px 0 0;line-height:1.5}
  .pop-row-col{flex-direction:column;gap:2px}
  .pop-row-col b{text-align:left}

  .log{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
  .log li{display:flex;gap:10px;font-size:.82rem;padding:8px 10px;background:var(--surface-2);
    border-radius:8px;border:1px solid var(--line)}
  .log .d{font-family:var(--font-data);color:var(--muted);flex:none;font-size:.76rem;padding-top:1px}
  .log .empty{color:var(--muted);font-style:italic;background:transparent;border:0;padding:4px 0}
  .log .note{flex:1;min-width:0}
  .rec-actions{display:flex;gap:2px;flex:none;margin-left:auto}
  .icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;
    padding:3px 6px;border-radius:5px;line-height:1}
  .icon-btn:hover{background:var(--line);color:var(--fg)}
  .log .edit-li{display:block;padding:10px}
  .edit-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
  .edit-form input{font-family:var(--font-ui);font-size:.82rem;background:var(--surface);
    color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  .edit-form input[type=date]{width:auto}
  .edit-form .note-in{flex:1 1 140px;min-width:0}
  .edit-form .chk{display:inline-flex;flex-direction:row;align-items:center;gap:6px;width:auto;
    font-size:.78rem;color:var(--muted);cursor:pointer}
  .edit-form .chk input{width:auto;margin:0}
  .edit-form .acts{display:flex;gap:6px;flex:none}
  .form-hint{font-size:.72rem;color:var(--muted);margin:2px 0 0}
  .btn.sm{padding:6px 12px;font-size:.78rem}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:var(--crit);color:#fff}
  .log .confirm-li{align-items:center}
  .confirm-li .note{color:var(--crit);font-weight:600}

  details{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--accent);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ ";font-family:var(--font-data)}
  details[open] summary::before{content:"– "}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .form label{font-size:.76rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .form input,.form textarea{font-family:var(--font-ui);font-size:.88rem;background:var(--surface-2);
    color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
  .form textarea{resize:vertical;min-height:52px}
  .form input:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .btn{font-family:var(--font-ui);font-weight:700;font-size:.86rem;cursor:pointer;
    background:var(--accent);color:#06121b;border:0;border-radius:8px;padding:10px 16px;align-self:flex-start}
  .btn:hover{filter:brightness(1.08)}
  .form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.84rem;cursor:pointer}
  .form .chk input{width:auto;margin:0}
  .form .next-field.hidden{display:none}

  .foot-note{max-width:1100px;margin:8px auto 0;font-size:.74rem;color:var(--muted);
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px))}
  .foot-note code{font-family:var(--font-data);font-size:.72rem;background:var(--surface-2);
    padding:1px 5px;border-radius:4px;color:var(--fg)}

  /* Details chart + modal */
  .details-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;
    font-family:var(--font-ui);font-weight:600;font-size:.72rem;color:var(--muted);padding:4px 8px;border-radius:999px}
  .details-dot{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--accent);flex:none;transition:background .15s,color .15s}
  .details-dot svg{width:14px;height:14px}
  .details-btn:hover{color:var(--fg)}
  .details-btn:hover .details-dot{background:var(--accent);color:#06121b;border-color:transparent}
  .spark-labels{display:flex;justify-content:space-between;width:100%;font-size:.6rem;color:var(--muted);
    font-family:var(--font-data);margin-top:3px;padding:0 1px}
  .spark .gmin{stroke:var(--line);stroke-width:1;opacity:.3}
  .m-chart .grid-minor{stroke:var(--line);stroke-width:1;opacity:.28}
  .m-chart .xl{font-size:9px}
  .m-chart .xcap{font-size:9px;opacity:.8}
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:900px;padding:18px;box-shadow:0 14px 48px rgba(0,0,0,.45);max-height:88vh;overflow:auto}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .modal-head h3{margin:0;font-size:1.1rem}
  .range-tabs{display:flex;gap:6px;margin-bottom:14px}
  .range-tabs button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
    font-family:var(--font-ui);font-weight:600;font-size:.84rem;padding:8px;border-radius:8px;cursor:pointer}
  .range-tabs button.active{background:var(--accent);color:#06121b;border-color:transparent}
  .m-chart{width:100%}
  .m-chart svg{width:100%;height:auto;display:block}
  .m-chart text{font-size:11px;fill:var(--muted);font-family:var(--font-data)}
  .m-chart .grid{stroke:var(--line);stroke-width:1}
  .m-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:.82rem;color:var(--muted);font-family:var(--font-data)}
  .m-stats b{color:var(--fg);font-weight:600}
</style>

<header>
  <div class="wrap">
    <div class="head-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><path d="M22 10v4"/><path d="M12 10l-2 3h3l-2 3"/></svg>
        </span>
        <div class="brand-text">
          <h1>Battery Monitoring System</h1>
          <p class="sub">Superior Laundry Equipment — Warehouse</p>
        </div>
      </div>
      <div class="head-meta">
        <span class="demo-chip" id="demoChip">Demo mode</span>
        <span class="clock" id="clock">—</span>
      </div>
    </div>
    <div class="wrap" style="padding:0">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" id="tab-live" data-view="live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
          Live
        </button>
        <button class="tab" role="tab" aria-selected="false" id="tab-service" data-view="service">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a2 2 0 1 0 2.8 2.8l6-6a4 4 0 0 0 5.4-5.4l-2.3 2.3-2.1-2.1 2.3-2.3z"/></svg>
          Service
          <span class="badge" id="srvBadge" hidden>0</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-live" role="tabpanel" aria-labelledby="tab-live">
    <div class="list-head" aria-hidden="true">
      <span>Stacker</span><span>Charge</span><span>Voltage</span><span>Trend</span><span>Status</span>
    </div>
    <div class="grid" id="cards"></div>
  </section>

  <section id="view-service" role="tabpanel" aria-labelledby="tab-service" hidden>
    <div class="alert hidden" id="srvAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span id="srvAlertText"></span>
    </div>
    <div id="srvList"></div>
  </section>
</main>
<p class="foot-note" id="footNote"></p>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" id="mBackdrop"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head">
      <h3 id="mTitle">—</h3>
      <button class="icon-btn" id="mClose" aria-label="Close">✕</button>
    </div>
    <div class="range-tabs" id="rangeTabs">
      <button data-range="24" class="active">24h</button>
      <button data-range="48">48h</button>
      <button data-range="72">72h</button>
    </div>
    <div id="mChart" class="m-chart"></div>
    <div id="mStats" class="m-stats"></div>
  </div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<script>
"use strict";
/* ============================================================
   Configuration — Supabase
   Leave blank for the demo. When deploying to Netlify, paste your
   Project URL and anon key and the app switches to live data.
   ============================================================ */
const SUPABASE_URL = "";   // e.g. https://xxxx.supabase.co
const SUPABASE_KEY = "";   // anon key
const LIVE_MODE = Boolean(SUPABASE_URL && SUPABASE_KEY);

/* ---------- Chemistry -> percent ----------
   Lead-acid: resting voltage, normalised to a 12V block.
   Lithium: normalised per cell (for the future — unused in the demo). */
const LEAD = [[12.73,100],[12.62,90],[12.50,80],[12.37,70],[12.24,60],[12.10,50],[11.96,40],[11.81,30],[11.66,20],[11.51,10],[11.40,0]];
const LIFE = [[3.45,100],[3.40,99],[3.35,90],[3.32,80],[3.30,70],[3.28,60],[3.26,50],[3.25,40],[3.22,30],[3.20,20],[3.13,10],[3.00,5],[2.80,0]];
function lerp(table,x){
  if(x>=table[0][0])return 100;
  if(x<=table[table.length-1][0])return 0;
  for(let i=0;i<table.length-1;i++){
    const[vh,ph]=table[i],[vl,pl]=table[i+1];
    if(x<=vh&&x>=vl)return Math.round(pl+(x-vl)/(vh-vl)*(ph-pl));
  }
  return 0;
}
function percentOf(b){
  if(b.chem==="lead")  return lerp(LEAD, b.v/(b.nominal/12));
  if(b.chem==="lifepo4")return lerp(LIFE, b.v/Math.round(b.nominal/3.2));
  return 0;
}
function statusOf(pct){
  if(pct>=50)return {key:"ok",   label:"Good",        color:"var(--ok)",  dim:"var(--ok-dim)"};
  if(pct>=20)return {key:"warn", label:"Charge soon", color:"var(--warn)",dim:"var(--warn-dim)"};
  return            {key:"crit", label:"Charge now",  color:"var(--crit)",dim:"var(--crit-dim)"};
}

const HIST = {};

  arr[arr.length-1]=b.v; HIST[b.id]=arr;
});

/* ---------- 72h history (generated for the demo) ---------- */
function genHist72(b){
  const full=b.nominal*1.06, low=b.nominal*1.00, arr=[];
  for(let h=0;h<72;h++){
    const p=h%24;
    let v = p<16 ? full-(full-low)*(p/16) : low+(full-low)*((p-16)/8);
    v += (Math.random()*0.2-0.1);
    arr.push(v);
  }
  arr[arr.length-1]=b.v;
  return arr;
}
const HIST72={};
STACKERS.forEach(b=>{ HIST72[b.id]=genHist72(b); });

const SRV_KEY="stacker_service_v4";

  return structuredClone(DEFAULT_SRV);
}
function saveSrv(d){ try{ localStorage.setItem(SRV_KEY,JSON.stringify(d)); }catch(e){} }
let SERVICE=loadSrv();

const DAY=86400000;
function addMonths(iso,m){ const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+m); return d; }
function addMonthsStr(iso,m){ const d=addMonths(iso,m);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(d){ const x=(d instanceof Date)?d:new Date(d+"T00:00:00");
  return x.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); }
function lastService(id){ const l=SERVICE[id]; if(!l||!l.length)return null;
  return [...l].sort((a,b)=>a.date<b.date?1:-1)[0]; }
function dueInfo(id){
  const list=SERVICE[id]; if(!list||!list.length)return null;
  // Scheduling ignores one-time records: use the most recent service that has a next-due date.
  const scheduled=list.filter(r=>r.next).sort((a,b)=>a.date<b.date?1:-1);
  if(!scheduled.length){
    const lastAny=[...list].sort((a,b)=>a.date<b.date?1:-1)[0];
    return {oneTime:true,last:lastAny};
  }
  const last=scheduled[0];
  const due=new Date(last.next+"T00:00:00");
  const days=Math.round((due-new Date(new Date().toDateString()))/DAY);
  return {due,days,last};
}

/* ---------- Sparkline ---------- */
function sparkline(arr,color){
  const w=240,h=40,pad=3;
  const mn=Math.min(...arr),mx=Math.max(...arr),rng=(mx-mn)||1;
  const pts=arr.map((v,i)=>{
    const x=pad+i/(arr.length-1)*(w-2*pad);
    const y=h-pad-((v-mn)/rng)*(h-2*pad);
    return [x,y];
  });
  const divs=6; let gmin="";
  for(let k=0;k<=divs;k++){ const gx=(pad+(k/divs)*(w-2*pad)).toFixed(1);
    gmin+=`<line class="gmin" x1="${gx}" y1="${pad}" x2="${gx}" y2="${h-pad}" vector-effect="non-scaling-stroke"/>`; }
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L ${w-pad} ${h-pad} L ${pad} ${h-pad} Z`;
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${gmin}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
}

let cardEls={};
function renderCards(){

  host.innerHTML=STACKERS.map(b=>{
    const pct=percentOf(b), st=statusOf(pct);
    const _a=HIST[b.id], _mn=Math.min(..._a), _mx=Math.max(..._a);
    const smx=_mx.toFixed(1), smn=_mn.toFixed(1), smid=((_mn+_mx)/2).toFixed(1);
    return `<article class="card" id="card-${b.id}" style="--st-color:${st.color};--st-dim:${st.dim}">
      <div class="c-name">
        <img class="st-img" src="${b.img}" alt="${b.model}">
        <div class="st-text">
          <h2 class="st-name">${b.name}</h2>
          <p class="st-meta">${b.model} · ${b.nominal}V</p>
        </div>
      </div>
      <div class="c-pct"><span class="pct">${pct}<small>%</small></span></div>
      <div class="c-volt">
        <span class="volt">${b.v.toFixed(2)} <small>V</small></span>
        <div class="c-live"><b></b>${LIVE_MODE?"Live":"Simulated"}</div>
      </div>
      <div class="c-graph">
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="trend">
          <div class="trend-y"><span class="ymax">${smx}</span><span class="ymid">${smid}</span><span class="ymin">${smn}</span></div>
          <div class="trend-main">
            ${sparkline(HIST[b.id],st.color)}
            ${sparkLabels}
          </div>
        </div>
      </div>
      <div class="c-pill">
        <span class="pill">${st.label}</span>
        <button class="details-btn" data-details="${b.id}">
          <span class="details-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 15l5-5 4 3 7-8"/></svg></span>
          View details
        </button>
      </div>
    </article>`;
  }).join("");
  cardEls={};
  STACKERS.forEach(b=>{
    const el=document.getElementById("card-"+b.id);
    cardEls[b.id]={card:el,pct:el.querySelector(".pct"),volt:el.querySelector(".volt"),
      bar:el.querySelector(".bar>i"),pill:el.querySelector(".pill"),graph:el.querySelector(".c-graph"),
      ymax:el.querySelector(".ymax"),ymid:el.querySelector(".ymid"),ymin:el.querySelector(".ymin")};
  });
}
/* Update only the changing values — never touches the <img>, so no reload or flicker. */
function updateCards(){
  STACKERS.forEach(b=>{
    const c=cardEls[b.id]; if(!c)return;
    const pct=percentOf(b), st=statusOf(pct);
    c.card.style.setProperty("--st-color",st.color);
    c.card.style.setProperty("--st-dim",st.dim);
    c.pct.innerHTML=`${pct}<small>%</small>`;
    c.volt.innerHTML=`${b.v.toFixed(2)} <small>V</small>`;
    c.bar.style.width=pct+"%";
    c.pill.textContent=st.label;
    const arr=HIST[b.id], mn=Math.min(...arr), mx=Math.max(...arr);
    if(c.ymax)c.ymax.textContent=mx.toFixed(1);
    if(c.ymid)c.ymid.textContent=((mn+mx)/2).toFixed(1);
    if(c.ymin)c.ymin.textContent=mn.toFixed(1);
    const spark=c.graph.querySelector(".spark");
    if(spark) spark.outerHTML=sparkline(arr,st.color);
  });
}

/* ---------- Render: Service ---------- */
let editing=null;    // {id,i} of the record being edited inline, or null
let pendingDel=null; // {id,i} of the record awaiting delete confirmation, or null
let openInfo=null;   // stacker id whose detail popover is open, or null
function dueBadge(info){
  if(!info)return `<span class="due soon">No service yet</span>`;
  if(info.oneTime)return `<span class="due ok">One-time · no next due</span>`;
  const pl=d=>d===1?"day":"days";
  if(info.days<0){const d=Math.abs(info.days);return `<span class="due over">Overdue by ${d} ${pl(d)}</span>`;}
  if(info.days<=14)return `<span class="due soon">${info.days} ${pl(info.days)} left</span>`;
  return `<span class="due ok">${info.days} ${pl(info.days)} left</span>`;
}
function renderService(){
  const host=document.getElementById("srvList");
  let overdue=0;
  const today=new Date().toISOString().slice(0,10);
  const next3=addMonths(today,3).toISOString().slice(0,10);
  host.innerHTML=STACKERS.map(b=>{
    const info=dueInfo(b.id);
    if(info&&!info.oneTime&&info.days<0)overdue++;
    const recs=(SERVICE[b.id]||[]).map((e,idx)=>({...e,_i:idx})).sort((a,b)=>a.date<b.date?1:-1);
    const logHtml = recs.length
      ? recs.map(e=> (editing&&editing.id==b.id&&editing.i===e._i)
        ? `<li class="edit-li"><form class="edit-form" data-id="${b.id}" data-i="${e._i}">
             <input type="date" name="date" value="${e.date}" required>
             <label class="chk"><input type="checkbox" name="onetime"${e.next?"":" checked"}> one-time</label>
             <input type="text" name="note" class="note-in" value="${escapeHtml(e.note)}" placeholder="what was done" required>
             <span class="acts"><button class="btn sm" type="submit">Save</button><button class="btn sm ghost" type="button" data-act="cancel">Cancel</button></span>
           </form></li>`
        : (pendingDel&&pendingDel.id==b.id&&pendingDel.i===e._i)
        ? `<li class="confirm-li"><span class="note">Delete this record?</span><span class="rec-actions"><button class="btn sm danger" data-act="confirmdel" data-id="${b.id}" data-i="${e._i}">Delete</button><button class="btn sm ghost" data-act="canceldel">Cancel</button></span></li>`
        : `<li><span class="d">${e.date}</span><span class="note">${escapeHtml(e.note)}${e.next?"":' <em style="color:var(--muted)">· one-time</em>'}</span><span class="rec-actions"><button class="icon-btn" data-act="edit" data-id="${b.id}" data-i="${e._i}" title="Edit">✎</button><button class="icon-btn" data-act="del" data-id="${b.id}" data-i="${e._i}" title="Delete">✕</button></span></li>`
      ).join("")
      : `<li class="empty">No records</li>`;
    const pl2=d=>d===1?"day":"days";
    const popHtml = `<div class="srv-pop">${
      !info
        ? `<p class="pop-note">No service recorded yet. Add one below to start tracking.</p>`
        : info.oneTime
          ? `<div class="pop-row"><span>Type</span><b>One-time service</b></div>
             <div class="pop-row"><span>Last service</span><b>${fmtDate(info.last.date)}</b></div>
             <div class="pop-row pop-row-col"><span>What was done</span><b>${escapeHtml(info.last.note)}</b></div>
             <p class="pop-note">No next service is scheduled for this record.</p>`
          : `<div class="pop-row"><span>Status</span><b>${info.days<0?`Overdue by ${Math.abs(info.days)} ${pl2(Math.abs(info.days))}`:`${info.days} ${pl2(info.days)} left`}</b></div>
             <div class="pop-row"><span>Last service</span><b>${fmtDate(info.last.date)}</b></div>
             <div class="pop-row pop-row-col"><span>What was done</span><b>${escapeHtml(info.last.note)}</b></div>
             <div class="pop-row"><span>Next due</span><b>${fmtDate(info.due)}</b></div>
             <p class="pop-note">Calculated from the last service date and the next-due date set for it.</p>`
    }</div>`;
    return `<div class="srv">
      <div class="srv-head">
        <h3>${b.name} <span style="color:var(--muted);font-weight:400;font-size:.8rem">· ${b.model}</span></h3>
        <button class="due-btn" data-info="${b.id}" title="Details">${dueBadge(info)}</button>
      </div>
      ${openInfo==b.id?popHtml:""}
      <ul class="log">${logHtml}</ul>
      <details>
        <summary>Add service record</summary>
        <form class="form" data-id="${b.id}">
          <label>Service date
            <input type="date" name="date" value="${today}" required>
          </label>
          <label class="chk">
            <input type="checkbox" name="onetime"> One-time service (no next due)
          </label>
          <label>What was done
            <textarea name="note" placeholder="e.g. Cells checked, terminals cleaned" required></textarea>
          </label>
          <p class="form-hint">Next service is set automatically to 3 months after the service date.</p>
          <button class="btn" type="submit">Save</button>
        </form>
      </details>
    </div>`;
  }).join("");

  host.querySelectorAll("form.form").forEach(f=>{
    f.addEventListener("submit",onAddService);
    const cb=f.querySelector('input[name="onetime"]');
    const nfs=f.querySelectorAll(".next-field");
    cb.addEventListener("change",()=>nfs.forEach(nf=>nf.classList.toggle("hidden",cb.checked)));
  });
  host.querySelectorAll("form.edit-form").forEach(f=>{
    f.addEventListener("submit",onEditService);
    const cb=f.querySelector('input[name="onetime"]');
    cb.addEventListener("change",()=>f.querySelectorAll(".next-in,.nextnote-in").forEach(x=>x.disabled=cb.checked));
  });

  const badge=document.getElementById("srvBadge");
  const alert=document.getElementById("srvAlert");
  if(overdue>0){
    badge.textContent=overdue; badge.hidden=false;
    alert.classList.remove("hidden");
    document.getElementById("srvAlertText").textContent=
      `${overdue} stacker${overdue===1?"":"s"} overdue for service — schedule a check.`;
  }else{
    badge.hidden=true; alert.classList.add("hidden");
  }
}
function onAddService(e){
  e.preventDefault();
  const id=e.target.dataset.id;
  const fd=new FormData(e.target);
  const onetime=fd.get("onetime")!=null;
  const rec={date:fd.get("date"), next:onetime?null:addMonthsStr(fd.get("date"),3), note:(fd.get("note")||"").trim()};
  if(!rec.note)return;
  (SERVICE[id]=SERVICE[id]||[]).push(rec);
  saveSrv(SERVICE);
  if(LIVE_MODE) postService(id,rec); // writes to Supabase on Netlify
  renderService();
}
function onEditService(e){
  e.preventDefault();
  const id=e.target.dataset.id, i=+e.target.dataset.i;
  const fd=new FormData(e.target);
  const onetime=fd.get("onetime")!=null;
  const note=(fd.get("note")||"").trim(); if(!note)return;
  SERVICE[id][i]={date:fd.get("date"), next:onetime?null:addMonthsStr(fd.get("date"),3), note};
  saveSrv(SERVICE);
  if(LIVE_MODE) postService(id,SERVICE[id][i]);
  editing=null; renderService();
}
function delRec(id,i){
  if(!SERVICE[id])return;
  SERVICE[id].splice(i,1);
  saveSrv(SERVICE);
  if(editing&&editing.id==id)editing=null;
  renderService();
}
function onRecClick(e){
  const inf=e.target.closest("button[data-info]");
  if(inf){ const iid=inf.dataset.info; openInfo=(openInfo===iid?null:iid); renderService(); return; }
  const btn=e.target.closest("button[data-act]"); if(!btn)return;
  const act=btn.dataset.act, id=btn.dataset.id, i=+btn.dataset.i;
  if(act==="del"){ pendingDel={id,i}; editing=null; renderService(); }
  else if(act==="confirmdel"){ pendingDel=null; delRec(id,i); }
  else if(act==="canceldel"){ pendingDel=null; renderService(); }
  else if(act==="edit"){ editing={id,i}; pendingDel=null; renderService(); }
  else if(act==="cancel"){ editing=null; renderService(); }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- Tabs ---------- */
function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  document.getElementById("view-live").hidden   = v!=="live";
  document.getElementById("view-service").hidden= v!=="service";
  try{location.hash=v;}catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.view)));

/* ---------- Clock ---------- */
function tickClock(){
  const now=new Date();
  document.getElementById("clock").textContent=
    now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

/* ---------- Demo simulation ---------- */
function simulate(){
  STACKERS.forEach(b=>{
    b.v += (Math.random()*0.06-0.03);           // small noise
    const pct=percentOf(b);
    if(pct<8)  b.v += 0.05;                      // keep it from drifting too low
    if(pct>98) b.v -= 0.05;
    const arr=HIST[b.id]; arr.push(b.v); if(arr.length>28)arr.shift();
  });
  updateCards();
}

/* ============================================================
   Live mode (Netlify + Supabase) — not run in the demo.
   Polls the latest readings over the REST API.
   ============================================================ */
async function pollSupabase(){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/readings?select=stacker_id,voltage,created_at&order=created_at.desc&limit=60`,{
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }
    });
    const rows=await r.json();
    const seen=new Set();
    rows.forEach(row=>{
      if(seen.has(row.stacker_id))return; seen.add(row.stacker_id);
      const b=STACKERS.find(s=>s.id===row.stacker_id);
      if(b){ b.v=Number(row.voltage);
        const a=HIST[b.id]; a.push(b.v); if(a.length>28)a.shift(); }
    });
    updateCards();
  }catch(e){ console.warn("Supabase poll failed:",e); }
}
async function postService(id,rec){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/service_log`,{
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json", Prefer:"return=minimal" },
      body:JSON.stringify({ stacker_id:Number(id), service_date:rec.date, next_due:rec.next, note:rec.note })
    });
  }catch(e){ console.warn("Service write failed:",e); }
}

/* ---------- Detail chart (modal) ---------- */
function drawChart(values,color){
  const W=900,H=272,ml=46,mr=16,mt=16,mb=44,pw=W-ml-mr,ph=H-mt-mb,n=values.length;
  let mn=Math.min(...values),mx=Math.max(...values);
  const pad=(mx-mn)*0.15||0.5; mn-=pad; mx+=pad;
  const X=j=>ml+(n<=1?0:j/(n-1))*pw, Y=v=>mt+ph-((v-mn)/(mx-mn))*ph;
  let minor="";
  for(let j=0;j<n;j++){ const x=X(j); minor+=`<line class="grid-minor" x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${(mt+ph).toFixed(1)}"/>`; }
  let grid="",ylab="";
  for(let k=0;k<=4;k++){
    const val=mn+(mx-mn)*k/4, y=Y(val);
    grid+=`<line class="grid" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    ylab+=`<text x="${ml-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${val.toFixed(1)}</text>`;
  }
  const range=n-1; const lstep=Math.max(1,Math.ceil(range/24)); let xlab="";
  for(let ago=0; ago<=range; ago+=lstep){
    const x=X(range-ago);
    xlab+=`<text class="xl" x="${x.toFixed(1)}" y="${(H-26).toFixed(1)}" text-anchor="middle">${ago===0?"now":"-"+ago+"h"}</text>`;
  }
  xlab+=`<text class="xcap" x="${(ml+pw/2).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle">hours ago</text>`;
  const pts=values.map((v,j)=>[X(j),Y(v)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L ${X(n-1).toFixed(1)} ${(mt+ph).toFixed(1)} L ${ml} ${(mt+ph).toFixed(1)} Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Voltage over time">
    ${minor}
    ${grid}
    <path d="${area}" fill="${color}" opacity="0.1"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/>
    ${ylab}${xlab}
  </svg>`;
}
let modalState={id:null,range:24};
function renderModal(){
  const b=STACKERS.find(s=>s.id===modalState.id); if(!b)return;
  const vals=HIST72[b.id].slice(-modalState.range);
  const st=statusOf(percentOf(b));
  document.getElementById("mTitle").textContent=`${b.name} · ${b.model}`;
  document.getElementById("mChart").innerHTML=drawChart(vals,st.color);
  const mn=Math.min(...vals),mx=Math.max(...vals),now=vals[vals.length-1];
  document.getElementById("mStats").innerHTML=
    `<span>Now <b>${now.toFixed(2)} V</b></span><span>Min <b>${mn.toFixed(2)} V</b></span><span>Max <b>${mx.toFixed(2)} V</b></span><span>Swing <b>${(mx-mn).toFixed(2)} V</b></span>`;
}
function openModal(id){
  modalState={id:+id,range:24};
  document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("active",+x.dataset.range===24));
  renderModal();
  document.getElementById("modal").hidden=false;
}
function closeModal(){ document.getElementById("modal").hidden=true; }

/* ---------- Boot ---------- */
function boot(){
  if(!LIVE_MODE){
    document.getElementById("demoChip").textContent="Demo mode — simulated data";
  }else{
    document.getElementById("demoChip").hidden=true;
  }
  const h=(location.hash||"").replace("#","");
  renderCards(); renderService();
  document.getElementById("srvList").addEventListener("click",onRecClick);
  document.addEventListener("click",e=>{
    if(openInfo!=null && !e.target.closest(".srv-pop") && !e.target.closest("button[data-info]")){ openInfo=null; renderService(); }
  });
  document.getElementById("cards").addEventListener("click",e=>{
    const g=e.target.closest("[data-details]"); if(g) openModal(g.dataset.details);
  });
  document.getElementById("mClose").addEventListener("click",closeModal);
  document.getElementById("mBackdrop").addEventListener("click",closeModal);
  document.getElementById("rangeTabs").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-range]"); if(!btn)return;
    modalState.range=+btn.dataset.range;
    document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("active",x===btn));
    renderModal();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });
  setView(h==="service"?"service":"live");
  tickClock(); setInterval(tickClock,1000);

  if(LIVE_MODE){ pollSupabase(); setInterval(pollSupabase,5000); }
  else{ setInterval(simulate,3000); }

  document.getElementById("footNote").innerHTML =
    LIVE_MODE
    ? "Live mode — data from Supabase."
    : "Demo mode: numbers are simulated. To switch to live data, set <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> at the top of the file and deploy to Netlify.";
}
boot();
</script>
